<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lantern</title>
  <style>
    :root { color-scheme: light; --ink:#241b12; --muted:#74685c; --paper:#fffaf0; --gold:#ffb000; --gold2:#ff7a00; --line:#eadfce; }
    * { box-sizing: border-box; }
    body { margin:0; width:360px; min-height:285px; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif; color:var(--ink); background:linear-gradient(145deg,#fffdf8,var(--paper)); }
    main { padding:20px; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .mark { width:36px; height:36px; display:grid; place-items:center; border-radius:12px; color:#fff; font-size:20px; background:linear-gradient(145deg,var(--gold),var(--gold2)); box-shadow:0 8px 20px #ff9c0033; }
    h1 { font-size:19px; margin:0; letter-spacing:-.02em; }
    .sub { color:var(--muted); font-size:12px; }
    label { display:block; font-weight:650; margin-bottom:7px; }
    textarea { width:100%; min-height:78px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; color:inherit; background:#fff; outline:none; }
    textarea:focus { border-color:var(--gold2); box-shadow:0 0 0 3px #ff99001f; }
    button { border:0; border-radius:10px; font:inherit; font-weight:700; cursor:pointer; }
    #search { width:100%; margin-top:10px; padding:11px; color:#fff; background:linear-gradient(120deg,var(--gold2),var(--gold)); }
    #search:disabled { opacity:.55; cursor:wait; }
    #status { min-height:22px; margin:11px 1px 0; color:var(--muted); font-size:12px; }
    nav { display:none; grid-template-columns:42px 1fr 42px; align-items:center; gap:8px; margin-top:4px; }
    nav button { padding:8px; background:#fff; border:1px solid var(--line); }
    #count { text-align:center; font-variant-numeric:tabular-nums; color:var(--muted); }
    footer { margin-top:12px; color:#94877a; font-size:10px; text-align:center; }
  </style>
</head>
<body><main>
  <header><div class="mark">🏮</div><div><h1>Lantern</h1><div class="sub">Light up the passage you mean.</div></div></header>
  <label for="query">What are you looking for?</label>
  <textarea id="query" placeholder="e.g. Can content I bought become unavailable?"></textarea>
  <button id="search">Search this page</button>
  <div id="status" role="status" aria-live="polite">Ready on ordinary webpages.</div>
  <nav id="nav" aria-label="Matches"><button id="prev" aria-label="Previous match">←</button><span id="count">0 of 0</span><button id="next" aria-label="Next match">→</button></nav>
  <footer>Visible page text is sent only when you search.</footer>
</main><script src="popup.js"></script></body></html>
