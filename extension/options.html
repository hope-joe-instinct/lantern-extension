<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lantern settings</title><style>body{font:15px/1.5 system-ui;max-width:620px;margin:40px auto;padding:0 20px;color:#251b12}h1{font-size:26px}label{display:block;font-weight:650;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d9cbb8;border-radius:9px}button{margin-top:20px;padding:10px 16px;border:0;border-radius:9px;background:#ff8500;color:white;font-weight:700}#status{margin-left:10px;color:#6d6257}.note{color:#6d6257;font-size:13px}</style></head><body><h1>Lantern settings</h1><p>Pair this install with the private Lantern backend. These values stay in this Chrome profile and are not part of the extension source.</p><label for="api">Worker URL</label><input id="api" type="url" placeholder="https://lantern-private-alpha.example.workers.dev/api/rank"><label for="token">Install token</label><input id="token" type="password" autocomplete="off"><p class="note">The TypeSafe key belongs only in the backend secret store and is never entered here.</p><button id="save">Save settings</button><span id="status" role="status"></span><script src="options.js"></script></body></html>
